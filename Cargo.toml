[package]
name = "grassfinder"
version = "0.4.1"
edition = "2021"
description = "Grass-coordinate finder using wgpu (Metal/Vulkan/DX12) and Rayon CPU fallback"

[dependencies]
wgpu = "=30.0.1"
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "0.4"
rayon = "1.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
